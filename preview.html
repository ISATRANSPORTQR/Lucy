
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Lulú ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Georgia, serif;
      color: white;
      text-align: center;
      background: linear-gradient(135deg, #160b27, #421c55, #170d2d);
      overflow-x: hidden;
    }

    .card {
      width: 100%;
      max-width: 480px;
      padding: 35px 25px;
      border: 1px solid #ffffff35;
      border-radius: 25px;
      background: #ffffff12;
      box-shadow: 0 0 35px #e9a6ff30;
      backdrop-filter: blur(10px);
    }

    .cat {
      font-size: 65px;
      animation: float 2s ease-in-out infinite;
    }

    h1 {
      color: #ffc8e9;
      font-size: 30px;
    }

    p {
      line-height: 1.7;
      font-size: 17px;
    }

    .heart {
      color: #ff8fc9;
      font-size: 25px;
    }

    .music {
      margin-top: 25px;
      padding: 18px;
      border-radius: 16px;
      background: #ffffff15;
    }

    audio {
      width: 100%;
      margin-top: 12px;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="cat">🐈‍⬛</div>

    <h1>Me gustas mucho, Lucy ❤️</h1>

    <p>
      No sé si te lo digo lo suficiente, pero me gusta
      compartir momentos contigo, conocerte y descubrir
      cada vez más de t y perdón por mis delicez ofensivos.
    </p>

    <p>
      No quiero apresurar nada, simplemente quiero
      seguir disfrutando de esto contigo.
    </p>

    <div class="heart">♡</div>

    <section class="music">
      <p>🎵 Una canción para ti</p>
      <audio controls preload="metadata">
        <source src="musica.mp3" type="audio/mpeg">
        Tu navegador no admite la reproducción de audio.
      </audio>
    </section>
  </main>
</body>
</html>
